<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Argus · Choose a new password</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml" />
  <script src="theme-boot.js"></script>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-page">
  <form id="changePassword" class="login-card">
    <h1>Choose a new password</h1>
    <p>Your password was reset. Choose your own password before continuing to Argus.</p>
    <label for="currentPassword">Temporary password</label>
    <input id="currentPassword" type="password" autocomplete="current-password" required autofocus />
    <label for="newPassword">New password (at least 8 characters)</label>
    <input id="newPassword" type="password" autocomplete="new-password" required minlength="8" maxlength="1024" />
    <label for="confirmPassword">Confirm new password</label>
    <input id="confirmPassword" type="password" autocomplete="new-password" required minlength="8" maxlength="1024" />
    <p id="passwordError" role="alert" hidden></p>
    <button type="submit">Save new password</button>
    <button id="passwordSignOut" type="button">Sign out</button>
  </form>
  <script type="module" src="change-password.js"></script>
  <script type="module" src="show-password.js"></script>
</body>
</html>
