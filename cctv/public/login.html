<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" href="/logo.svg" type="image/svg+xml" />
  <!-- installable: Add to Home Screen opens Argus full screen, without the browser's bars -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Argus" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0e1012" />
  <title>Argus · Sign in</title>
  <script src="theme-boot.js"></script>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-page">
  <form id="login" class="login-card" autocomplete="on">
    <!-- the Argus wordmark (docs/brand in the app repository, concept A), inline so the sign-in page needs no other file -->
    <h1 class="login-brand login-wordmark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 108" role="img" aria-label="Argus"><rect width="340" height="108" fill="#0A192F"/><g transform="translate(12,12) scale(.65)"><defs><clipPath id="a-guardian-eye-eye-clip"><path d="M32,62 C48,41 80,41 96,62 C80,81 48,81 32,62 Z"/></clipPath></defs><g fill="none" transform="rotate(0 64 62)" opacity="0"> <circle cx="64" cy="62" r="25" stroke="#00F5FF" stroke-opacity=".07" stroke-width="10"/> <circle cx="64" cy="62" r="23" stroke="#00AEEF" stroke-width="4"/> <path d="M64,45 A17,17 0 0 1 81,62" stroke="#00F5FF" stroke-width="3" stroke-linecap="round"/></g><path d="M64,15 L102,31 L102,65 C102,88 82,103 64,113 C46,103 26,88 26,65 L26,31 L64,15 Z" fill="#00AEEF" fill-opacity=".045" stroke="#00AEEF" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0" opacity="1"/><g opacity="1"> <path d="M32,62 C48,41 80,41 96,62 C80,81 48,81 32,62 Z" fill="#FFFFFF"/> <g clip-path="url(#a-guardian-eye-eye-clip)">  <circle cx="64" cy="62" r="14" fill="#00AEEF"/>  <circle cx="64" cy="62" r="10" fill="#0A192F"/>  <path d="M61,57 L69,62 L61,67Z" fill="#00F5FF"/>  <circle cx="69" cy="56" r="1.5" fill="#FFFFFF" opacity=".85"/>  <path d="M64,45V79" stroke="#00F5FF" stroke-width="2" opacity="0"/> </g></g><circle cx="64" cy="62" r="47" fill="none" stroke="#00F5FF" stroke-width="2" opacity="0"/></g><g transform="translate(112,36)"><path d="M1 34L14 2L27 34M7 23H21" transform="translate(0,0)" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M2 34V2H15Q27 2 27 12Q27 22 15 22H2M15 22L28 34" transform="translate(40,0)" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M28 7Q22 2 15 2Q2 2 2 18Q2 34 15 34Q23 34 28 29V19H17" transform="translate(80,0)" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M2 2V22Q2 34 15 34Q28 34 28 22V2" transform="translate(120,0)" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M27 6Q22 2 15 2Q3 2 3 10Q3 18 15 18Q27 18 27 26Q27 34 15 34Q7 34 2 29" transform="translate(160,0)" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/></g></svg></h1>
    <label for="user">User name</label>
    <input id="user" name="user" autocomplete="username" required autofocus />
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />
    <p id="error" role="alert" hidden></p>
    <button type="submit">Sign in</button>
  </form>
  <script type="module" src="login.js"></script>
  <script type="module" src="show-password.js"></script>
</body>
</html>
