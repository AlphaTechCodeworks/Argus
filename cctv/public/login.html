<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" href="/logo.svg" type="image/svg+xml" />
  <!-- installable: Add to Home Screen opens Argus full screen, without the browser's bars -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Argus" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0e1012" />
  <title>Argus · Sign in</title>
  <script src="theme-boot.js"></script>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-page">
  <form id="login" class="login-card" autocomplete="on">
    <h1 class="login-brand"><img src="/logo.svg" alt="" width="44" height="44" /> Argus</h1>
    <label for="user">User name</label>
    <input id="user" name="user" autocomplete="username" required autofocus />
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />
    <p id="error" role="alert" hidden></p>
    <button type="submit">Sign in</button>
  </form>
  <script type="module" src="login.js"></script>
</body>
</html>
