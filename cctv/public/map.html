<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" href="/logo.svg" type="image/svg+xml" />
  <!-- installable: Add to Home Screen opens Argus full screen, without the browser's bars -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Argus" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0e1012" />
  <title>Argus · Map</title>
  <script src="theme-boot.js"></script>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/shell.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="map-layout.css" />
</head>
<body class="map-page">
  <header>
    <div class="brand">
      <h1>Map</h1>
    </div>
    <div class="controls">
      <button id="toggleMapSidebar" type="button" aria-label="Collapse map sidebar" title="Collapse map sidebar" aria-expanded="true" aria-controls="mapBrowser">Cameras</button>
      <label title="Satellite pictures instead of the street map"><input id="sat" type="checkbox" /> Satellite</label>
      <label title="Show camera names on the map"><input id="names" type="checkbox" checked /> Names</label>
      <button id="edit" type="button" hidden>Edit map</button>
      <button id="links" type="button" hidden title="Say which camera leads to which, so a follow can step from one to the next">Edit links</button>
    </div>
    <div class="account">
      <span id="build" class="build" title="Running build"></span>
      <span id="whoami"></span>
      <button id="logout" type="button">Sign out</button>
    </div>
  </header>

  <main class="map-main">
    <aside id="mapBrowser" class="map-browser" aria-label="Map browser">
      <details class="map-site-browser" open>
        <summary>Sites</summary>
        <div class="map-site-search"><input id="siteSearch" type="search" aria-label="Search sites" placeholder="Search sites" autocomplete="off" /></div>
        <nav id="sites" class="map-sites" aria-label="Sites on the map"></nav>
      </details>
      <div class="map-search">
        <input id="cameraSearch" type="search" aria-label="Search cameras" placeholder="Search cameras" autocomplete="off" />
        <label class="map-issues"><input id="issuesOnly" type="checkbox" /> Issues only</label>
      </div>
      <aside id="side" class="map-side" aria-label="Cameras"></aside>
      <div id="live" class="map-live" aria-label="Camera preview" hidden></div>
    </aside>
    <div id="map" class="map-view" tabindex="0" aria-label="Camera map">
      <div class="map-tiles"></div>
      <img class="map-plan" alt="" hidden />
      <svg class="map-overlay" aria-hidden="true"></svg>
      <div class="map-zoom">
        <button type="button" id="zoomIn" aria-label="Zoom in">+</button>
        <button type="button" id="zoomOut" aria-label="Zoom out">−</button>
        <button type="button" id="fit" aria-label="Show every camera" title="Show every camera">⤢</button>
      </div>
      <div class="map-credit" hidden></div>
      <div id="tileStatus" class="map-tile-status" role="status" hidden>Map imagery unavailable <button id="retryMap" type="button">Retry</button></div>
      <div id="empty" class="map-empty" hidden></div>
    </div>
  </main>

  <script type="module" src="shell.js"></script>
  <script type="module" src="map.js"></script>
  <script type="module" src="alert-banner.js"></script>
  <script type="module" src="build-badge.js"></script>
</body>
</html>
