name: CCTV tests (Linux)

# The cctv app's own tests are standalone node scripts (cctv/test/*.test.mjs, a custom check()
# harness), not the library's vitest suite that test.yml runs. They load the native TVT SDK through
# koffi (cctv/sdk.mjs -> bin/linux/*.so), so they only run on Linux with bin/linux on the library path.
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - '*.md'

jobs:
  cctv-tests:
    name: cctv app tests (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 24
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci

      - name: Run cctv app test suite
        env:
          # the TVT SDK .so and its siblings (libShareLib, libNatClientSDK, ...) live here
          LD_LIBRARY_PATH: ${{ github.workspace }}/bin/linux
          DATA_DIR: ${{ runner.temp }}/cctv-data
        run: |
          mkdir -p "$DATA_DIR"
          shopt -s nullglob
          pass=0
          fail=0
          failed=()
          for f in cctv/test/*.test.mjs; do
            echo "::group::$f"
            if timeout 300 node "$f"; then
              pass=$((pass + 1))
            else
              code=$?
              echo "::error file=$f::$f failed (exit $code)"
              fail=$((fail + 1))
              failed+=("$f")
            fi
            echo "::endgroup::"
          done
          echo "## cctv tests: $pass passed, $fail failed" >> "$GITHUB_STEP_SUMMARY"
          for f in "${failed[@]}"; do echo "- $f" >> "$GITHUB_STEP_SUMMARY"; done
          echo "passed: $pass  failed: $fail"
          test "$fail" -eq 0
